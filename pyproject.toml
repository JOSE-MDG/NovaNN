[tool.poetry]
name = "novann"                                     # Name in PyPI
version = "4.0.1"
description = "NovaNN deep learning framework"
authors = ["JOSE-MDG <josepemlengineer@gmail.com>"]
license = "MIT"
readme = "README.md"


# Real package
packages = [{ include = "nova" }]


[tool.poetry.dependencies]
python = ">=3.12,<4.0.0"
numpy = ">=2.3.5,<3.0.0"
pandas = ">=2.3.3,<3.0.0"
matplotlib = ">=3.10.7,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
scikit-learn = ">=1.7.2,<2.0.0"
pyarrow = ">=22.0.0,<23.0.0"
pyyaml = ">=6.0.3,<7.0.0"
requests = "^2.32.5"
openpyxl = "^3.1.5"
tqdm = "^4.67.1"


[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
black = ">=25.11.0,<26.0.0"


[tool.poetry.group.benchmark.dependencies]
torch = [{ version = ">=2.9.1,<3.0.0", python = ">=3.12,<3.15" }]
torchvision = [{ version = ">=0.24.1,<0.25.0", python = ">=3.12,<3.15" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
