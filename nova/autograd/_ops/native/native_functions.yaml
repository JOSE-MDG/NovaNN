##### Ops structure

ops:
  # Arithmetics methods

  - name: add
    tensor:
      dunder: "__add__"
      reverse: "__radd__"
      inplace:
        method: "add_"
        dunder: "__iadd__"

  - name: sub
    tensor:
      dunder: "__sub__"
      reverse: "__rsub__"
      inplace:
        method: "sub_"
        dunder: "__isub__"

  - name: mul
    tensor:
      dunder: "__mul__"
      reverse: "__rmul__"
      inplace:
        method: "mul_"
        dunder: "__imul__"

  - name: div
    tensor:
      dunder: "__truediv__"
      reverse: "__rtruediv__"
      inplace:
        method: "div_"
        dunder: "__itruediv__"

  - name: divint
    tensor:
      dunder: "__floordiv__"
      reverse: "__rfloordiv__"
      inplace:
        method: "floor_divide_"
        dunder: "__ifloordiv__"

  - name: mod
    tensor:
      dunder: "__mod__"
      reverse: "__rmod__"
      inplace:
        method: "mod_"
        dunder: "__imod__"

  - name: pow
    tensor:
      dunder: "__pow__"
      reverse: "__rpow__"
      inplace:
        method: "pow_"
        dunder: "__ipow__"

  - name: abs
    tensor:
      dunder: "__abs__"
      inplace:
        method: "abs_"

  - name: neg
    is_unary: true
    tensor:
      dunder: "__neg__"

  # Indexing

  - name: getitem
    raw_args: true
    tensor:
      dunder: "__getitem__"

  # Strides and views

  - name: stride_tricks
    tensor:
      method: as_strided

  - name: view
    tensor:
      method: view

  - name: extend
    tensor:
      method: extend

  # Linear algebra

  - name: matmul
    tensor:
      dunder: "__matmul__"
      reverse: "__rmatmul__"
      inplace:
        dunder: "__imatmul__"

  - name: det
    tensor:
      method: det

  - name: dot
    tensor:
      method: dot

  - name: inv
    tensor:
      method: inv

  - name: norm
    tensor:
      method: norm

  - name: trace
    tensor:
      method: trace

  # methods

  - name: floor
    tensor:
      method: floor
      inplace:
        method: floor_

  - name: log
    tensor:
      method: log
      inplace:
        method: log_

  - name: exp
    tensor:
      method: exp
      inplace:
        method: exp_

  - name: sqrt
    tensor:
      method: sqrt
      inplace:
        method: sqrt_

  - name: sign
    tensor:
      method: sign
      inplace:
        method: sign_

  - name: abs
    tensor:
      method: abs

  # reduction

  - name: max
    tensor:
      method: max

  - name: min
    tensor:
      method: min

  - name: mean
    tensor:
      method: mean

  - name: sum
    tensor:
      method: sum

  # manipulation

  - name: permute
    tensor:
      method: permute

  - name: reshape
    tensor:
      method: reshape

  - name: squeeze
    tensor:
      method: squeeze

  - name: unsqueeze
    tensor:
      method: unsqueeze

  - name: split
    tensor:
      method: split

  - name: clamp
    tensor:
      method: clamp
      inplace:
        method: clamp_

  - name: tile
    tensor:
      method: tile

  - name: repeat
    tensor:
      method: repeat

  - name: pad
    tensor:
      method: pad

  # trigonometrics

  - name: sin
    is_unary: true
    tensor:
      method: sin
      inplace:
        method: sin_

  - name: cos
    is_unary: true
    tensor:
      method: cos
      inplace:
        method: cos_

  - name: tan
    is_unary: true
    tensor:
      method: tan
      inplace:
        method: tan_

  - name: tanh
    is_unary: true
    tensor:
      method: tanh
      inplace:
        method: tanh_

  - name: cot
    is_unary: true
    tensor:
      method: cot
      inplace:
        method: cot_

  - name: sec
    is_unary: true
    tensor:
      method: sec
      inplace:
        method: sec_

  - name: arcsin
    is_unary: true
    tensor:
      method: arcsin
      inplace:
        method: arcsin_

  - name: arccos
    is_unary: true
    tensor:
      method: arccos
      inplace:
        method: arccos_

  - name: arctan
    is_unary: true
    tensor:
      method: arctan
