[project]
name = "novann"
version = "4.0.2"
description = "NovaNN deep learning framework"
authors = [{ name = "JOSE-MDG", email = "josepemlengineer@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
]
keywords = [
    "deep-learning",
    "neural-networks",
    "pytorch-like",
    "numpy",
    "autograd",
    "educational",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Education",
]

[project.urls]
Repository = "https://github.com/JOSE-MDG/NovaNN"

[tool.poetry]
packages = [{ include = "nova" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1,<10.0.0"
pytest-cov = ">=7.0.0,<8.0.0"
black = ">=25.11.0,<26.0.0"

[tool.poetry.group.benchmark.dependencies]
torch = [{ version = ">=2.9.1,<3.0.0", python = ">=3.12,<3.15" }]
torchvision = [{ version = ">=0.24.1,<0.25.0", python = ">=3.12,<3.15" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
