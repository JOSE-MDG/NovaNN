# Native operations registry for automatic Tensor method binding
# This file defines all operations and their corresponding method names

ops:
  # Basic arithmetic operations

  - name: add
    tensor:
      dunder: __add__
      reverse: __radd__
      inplace:
        method: add_
        dunder: __iadd__

  - name: sub
    tensor:
      dunder: __sub__
      reverse: __rsub__
      inplace:
        method: sub_
        dunder: __isub__

  - name: mul
    tensor:
      dunder: __mul__
      reverse: __rmul__
      inplace:
        method: mul_
        dunder: __imul__

  - name: div
    tensor:
      dunder: __truediv__
      reverse: __rtruediv__
      inplace:
        method: div_
        dunder: __itruediv__

  - name: divint
    tensor:
      dunder: __floordiv__
      reverse: __rfloordiv__
      inplace:
        method: floor_divide_
        dunder: __ifloordiv__

  - name: mod
    tensor:
      dunder: __mod__
      reverse: __rmod__
      inplace:
        method: mod_
        dunder: __imod__

  - name: pow
    raw_args: true # Keeps scalar exponents as raw values
    tensor:
      dunder: __pow__
      reverse: __rpow__
      method: pow
      inplace:
        method: pow_
        dunder: __ipow__

  - name: abs
    is_unary: true
    tensor:
      dunder: __abs__
      method: abs
      inplace:
        method: abs_

  - name: neg
    is_unary: true
    tensor:
      dunder: __neg__

  # Activation functions

  - name: relu
    is_unary: true
    tensor:
      method: relu
      inplace:
        method: relu_

  - name: leaky_relu
    raw_args: true # Alpha parameter stays as scalar
    tensor:
      method: leaky_relu
      inplace:
        method: leaky_relu_

  - name: prelu
    raw_args: true # Weight parameter stays as scalar/array
    tensor:
      method: prelu
      inplace:
        method: prelu_

  - name: gelu
    is_unary: true
    tensor:
      method: gelu
      inplace:
        method: gelu_

  - name: sigmoid
    is_unary: true
    tensor:
      method: sigmoid
      inplace:
        method: sigmoid_

  # Indexing operations

  - name: getitem
    raw_args: true # Indices are not converted to tensors
    tensor:
      dunder: __getitem__

  - name: setitem
    raw_args: true # Indices and values kept as-is
    tensor:
      inplace:
        dunder: __setitem__

  # Memory layout and view operations

  - name: stride_tricks
    tensor:
      method: as_strided

  - name: view
    tensor:
      method: view

  - name: extend
    tensor:
      method: extend

  # Linear algebra operations

  - name: matmul
    tensor:
      dunder: __matmul__
      reverse: __rmatmul__
      inplace:
        dunder: __imatmul__

  - name: det
    is_unary: true
    tensor:
      method: det

  - name: dot
    tensor:
      method: dot

  - name: inv
    is_unary: true
    tensor:
      method: inv

  - name: norm
    tensor:
      method: norm

  - name: trace
    tensor:
      method: trace

  # Mathematical functions

  - name: floor
    is_unary: true
    tensor:
      method: floor
      inplace:
        method: floor_

  - name: log
    is_unary: true
    tensor:
      method: log
      inplace:
        method: log_

  - name: ceil
    is_unary: true
    tensor:
      method: ceil
      inplace:
        method: ceil_

  - name: exp
    is_unary: true
    tensor:
      method: exp
      inplace:
        method: exp_

  - name: sqrt
    is_unary: true
    tensor:
      method: sqrt
      inplace:
        method: sqrt_

  - name: sign
    is_unary: true
    tensor:
      method: sign
      inplace:
        method: sign_

  # Reduction operations

  - name: max
    tensor:
      method: max

  - name: min
    tensor:
      method: min

  - name: mean
    tensor:
      method: mean

  - name: var
    tensor:
      method: var

  - name: sum
    tensor:
      method: sum

  # Shape manipulation operations

  - name: permute
    tensor:
      method: permute

  - name: reshape
    tensor:
      method: reshape

  - name: squeeze
    tensor:
      method: squeeze

  - name: unsqueeze
    tensor:
      method: unsqueeze

  - name: split
    tensor:
      method: split

  - name: clamp
    tensor:
      method: clamp
      inplace:
        method: clamp_

  - name: tile
    tensor:
      method: tile

  - name: repeat
    tensor:
      method: repeat

  - name: pad
    tensor:
      method: pad

  # Trigonometric functions

  - name: sin
    is_unary: true
    tensor:
      method: sin
      inplace:
        method: sin_

  - name: cos
    is_unary: true
    tensor:
      method: cos
      inplace:
        method: cos_

  - name: tan
    is_unary: true
    tensor:
      method: tan
      inplace:
        method: tan_

  - name: tanh
    is_unary: true
    tensor:
      method: tanh
      inplace:
        method: tanh_

  - name: cot
    is_unary: true
    tensor:
      method: cot
      inplace:
        method: cot_

  - name: sec
    is_unary: true
    tensor:
      method: sec
      inplace:
        method: sec_

  - name: arcsin
    is_unary: true
    tensor:
      method: arcsin
      inplace:
        method: arcsin_

  - name: arccos
    is_unary: true
    tensor:
      method: arccos
      inplace:
        method: arccos_

  - name: arctan
    is_unary: true
    tensor:
      method: arctan
      inplace:
        method: arctan_

  # Comparison operations

  - name: maximum
    tensor:
      method: maximum

  - name: minimum
    tensor:
      method: minimum
